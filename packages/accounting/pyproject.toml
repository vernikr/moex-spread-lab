[project]
name = "msl-accounting"
version = "0.9.0"
description = "MOEX Spread Lab Layer 1 accounting: costs, VTB risk, sizing, portfolio overlay, analytical ledger"
requires-python = ">=3.12,<3.13"
dependencies = [
    "msl-core",
]

[project.entry-points."moex_spread_lab.cli"]
accounting = "moex_spread_lab.accounting.cli:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
