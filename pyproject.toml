[project]
name = "moex-spread-lab"
version = "0.9.0"
description = "Research-first MOEX futures-spread evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2024",
    "duckdb>=1.2,<2",
    "msl-accounting",
    "msl-core",
    "msl-data",
    "msl-strategies",
    "msl-proof",
    "msl-web",
    "openpyxl>=3.1,<4",
    "optuna>=4.2,<5",
    "pyarrow>=18,<20",
    "zstandard>=0.23,<1",
]

[project.scripts]
moex-spread-lab = "moex_spread_lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
msl-accounting = { workspace = true }
msl-core = { workspace = true }
msl-data = { workspace = true }
msl-strategies = { workspace = true }
msl-proof = { workspace = true }
msl-web = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
# Plan S4a: the equivalence suite ships in two trial tiers. `slow_equiv` is the
# full-resolution parity tier (worker pool, C fallback, streaming progress, the
# 1h calendar cohort); it is deselected from default discovery and runs in
# `scripts/verify.py --profile pre-push`, the CI perf-equivalence job and the
# ASan/UBSan gate. No test is deleted and no parity trial count is trimmed.
addopts = ["-m", "not slow_equiv"]
markers = [
    "slow_equiv: full-resolution bit-for-bit parity; runs in --pre-push, CI and the sanitizer gate",
]
pythonpath = [
    "packages/core/src",
    "packages/data/src",
    "packages/accounting/src",
    "packages/strategies/src",
    "packages/proof/src",
    "packages/web/src",
    "src",
    ".",
    "packages/data/tests",
    "packages/accounting/tests",
    "packages/strategies/tests",
    "packages/proof/tests",
    "packages/web/tests",
    "packages/core/tests",
    "tests",
]
# Test discovery is package-scoped; root tests/ contains shared synthetic fixtures only.
testpaths = [
    "packages/core/tests",
    "packages/data/tests",
    "packages/accounting/tests",
    "packages/strategies/tests",
    "packages/proof/tests",
    "packages/web/tests",
]

[dependency-groups]
dev = [
    "basedpyright>=1.28,<2",
    "complexipy>=4.0,<6",
    "lizard>=1.17,<2",
    "pyarrow-stubs==19.4",
    "pytest>=8.3,<10",
    "pytest-subtests>=0.14,<1",
    "pytest-testmon>=2.3,<3",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.9,<1",
    "vulture>=2.14,<3",
]

# Code-health gate (docs/development/code-health-plan.md, Step 1).
# Tier 1 runs via scripts/check_health.sh; baselines freeze legacy
# violations so CI is green Day 1 while new violations fail.
[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/core/src",
    "packages/data/src",
    "packages/accounting/src",
    "packages/strategies/src",
    "packages/proof/src",
    "packages/web/src",
    "src",
    "tests",
    "packages/core/tests",
    "packages/data/tests",
    "packages/accounting/tests",
    "packages/strategies/tests",
    "packages/proof/tests",
    "packages/web/tests",
]
extend-exclude = ["**/vendor/**", "**/__pycache__/**"]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "B",
    "BLE",
    "UP",
    "SIM",
    "C4",
    "PIE",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "RUF",
]
ignore = [
    "E501",
    # RUF001/RUF003 flag intentional Russian UI strings/comments (AGENTS.md).
    "RUF001",
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR0913", "PLR0915", "BLE001", "E701", "E702", "RUF059", "E731"]
"packages/*/tests/**/*.py" = ["PLR0913", "PLR0915", "BLE001", "E701", "E702", "RUF059", "E731"]
# Legacy ratchet (Step 1): frozen violations in existing files. New files
# have no ignores and must be clean. Burn down per Step 4 of the plan.
"packages/accounting/tests/test_position_sizing.py" = ["B905"]
"packages/accounting/tests/test_run_artifact_import.py" = ["C401", "SIM117"]
"packages/core/src/moex_spread_lab/core/_fastcore_loader.py" = ["BLE001"]
"packages/core/src/moex_spread_lab/core/settings.py" = ["PLR0912"]
"packages/core/src/moex_spread_lab/core/w0.py" = ["C901", "PLR0912"]
"packages/core/tests/test_architecture_dag.py" = ["PLR0912"]
"packages/core/tests/test_cli_plugins.py" = ["SIM117"]
"packages/data/tests/test_benchmark.py" = ["C408"]
