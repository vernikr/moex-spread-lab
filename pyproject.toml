[project]
name = "moex-spread-lab"
version = "0.2.0"
description = "Research-first MOEX futures-spread evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2024",
    "openpyxl>=3.1,<4",
]

[project.scripts]
moex-spread-lab = "moex_spread_lab.cli:main"

[tool.uv]
package = true

[tool.setuptools.package-data]
moex_spread_lab = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
