name: Code Health Weekly (Tier 2 + Tier 3)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"  # weekly, Monday 04:30 UTC

permissions:
  contents: read

env:
  UV_COMPILE_BYTECODE: "1"
  UV_LINK_MODE: copy
  REPOWISE_SKIP_EDITOR_SETUP: "1"
  REPOWISE_NO_SAVE_KEY: "1"

jobs:
  weekly-audit:
    name: Tier 2 C99 + Tier 3 behavioral & clone digest (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js 22 for jscpd
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync locked environment (incl. dev group)
        run: uv sync --frozen

      - name: Size-report coverage gate (every touched path tracked or excluded)
        run: uv run size check

      - name: Ensure clang-tidy and clang sanitizer runtime
        run: |
          if ! command -v clang-tidy >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang clang-tidy
          fi

      - name: Run Tier 1 deterministic code-health gate
        run: ./scripts/check_health.sh

      - name: Run Tier 2 C99 clang-tidy & ASan/UBSan suite unconditionally
        run: |
          uv run python scripts/gen_compile_commands.py
          clang-tidy -p . packages/core/src/moex_spread_lab/core/_fastcore.c
          uv run python scripts/run_sanitized_pytest.py -v --tb=short -m "" \
            packages/proof/tests/test_perf_equivalence.py \
            packages/proof/tests/test_perf_equivalence_pair.py \
            packages/proof/tests/test_perf_equivalence_pool.py \
            packages/proof/tests/test_perf_equivalence_stream.py \
            packages/proof/tests/test_perf_equivalence_full.py \
            packages/proof/tests/test_fastcore_parity.py

      - name: Run jscpd duplication gate (<3.0% threshold)
        run: npx --yes jscpd@4.0.5 --config .jscpd.json

      - name: Build repowise behavioral index (hotspots, health, temporal coupling)
        run: |
          mkdir -p reports/code-health
          uvx repowise init . --yes --no-prose --follow-renames \
            --no-editor-setup --no-hook --no-claude-md --no-agents --no-codex --no-onboarding
          uvx repowise health --scope production --format json > reports/code-health/repowise-health.json

      - name: Render Markdown & JSON digest into $GITHUB_STEP_SUMMARY
        run: |
          uv run python scripts/render_code_health_digest.py \
            --jscpd-json reports/code-health/jscpd/jscpd-report.json \
            --repowise-health reports/code-health/repowise-health.json \
            --repowise-db .repowise/wiki.db \
            --output-md reports/code-health/code-health-digest.md \
            --output-json reports/code-health/code-health-digest.json
          cat reports/code-health/code-health-digest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Append code + tests token trend (size-report) to $GITHUB_STEP_SUMMARY
        run: |
          {
            echo "## Code + tests token trend (size-report, o200k_base)"
            echo '```text'
            uv run size now --category code --category tests
            echo
            uv run size log -n 20 --category code --category tests
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify clean tracked/unignored working tree
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "Unexpected repository dirtiness after weekly code-health audit:" >&2
            echo "$status" >&2
            exit 1
          fi

      - name: Upload code-health digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-health-digest
          path: |
            reports/code-health/code-health-digest.md
            reports/code-health/code-health-digest.json
            reports/code-health/jscpd/jscpd-report.json
          retention-days: 14
