"tests/proof_fixtures.py" = ["B905"]

[tool.basedpyright]
pythonVersion = "3.12"
include = [
    "packages/core/src",
    "packages/data/src",
    "packages/accounting/src",
    "packages/strategies/src",
    "packages/proof/src",
    "packages/web/src",
    "src",
    "scripts",
]
exclude = ["**/vendor/**", "**/__pycache__/**"]
