[project]
name = "moex-spread-lab"
version = "0.9.0"
description = "Research-first MOEX futures-spread evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2024",
    "duckdb>=1.2,<2",
    "msl-accounting",
    "msl-core",
    "msl-data",
    "msl-strategies",
    "msl-proof",
    "msl-web",
    "openpyxl>=3.1,<4",
    "optuna>=4.2,<5",
    "pyarrow>=18,<20",
    "zstandard>=0.23,<1",
]

[project.scripts]
moex-spread-lab = "moex_spread_lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
msl-accounting = { workspace = true }
msl-core = { workspace = true }
msl-data = { workspace = true }
msl-strategies = { workspace = true }
msl-proof = { workspace = true }
msl-web = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
# Plan S4a: the equivalence suite ships in two trial tiers. `slow_equiv` is the
# full-resolution parity tier (worker pool, C fallback, streaming progress, the
# 1h calendar cohort); it is deselected from default discovery and runs in
# `scripts/verify.py --profile pre-push`, the CI perf-equivalence job and the
# ASan/UBSan gate. No test is deleted and no parity trial count is trimmed.
addopts = ["-m", "not slow_equiv"]
markers = [
    "slow_equiv: full-resolution bit-for-bit parity; runs in --pre-push, CI and the sanitizer gate",
]
pythonpath = [
    "packages/core/src",
    "packages/data/src",
    "packages/accounting/src",
    "packages/strategies/src",
    "packages/proof/src",
    "packages/web/src",
    "src",
    ".",
    "packages/data/tests",
    "packages/accounting/tests",
    "packages/strategies/tests",
    "packages/proof/tests",
    "packages/web/tests",
    "packages/core/tests",
    "packages/accounting/tests",
    "tests",
]
# Test discovery is package-scoped; root tests/ contains shared synthetic fixtures only.
testpaths = [
    "packages/core/tests",
    "packages/data/tests",
    "packages/accounting/tests",
    "packages/strategies/tests",
    "packages/proof/tests",
    "packages/web/tests",
]

[dependency-groups]
dev = [
    "basedpyright>=1.28,<2",
    "complexipy>=4.0,<6",
    "deptry>=0.25.1",
    "jscpd>=5.4.3",
    "lizard>=1.17,<2",
    "pyarrow-stubs==19.4",
    "pytest>=8.3,<10",
    "pytest-subtests>=0.14,<1",
    "pytest-testmon>=2.3,<3",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.9,<1",
    "size-report[tokens]>=3.4.0",
    "vulture>=2.14,<3",
]

# Code-health gate (completed rollout history: GitHub Issue #36).
# Tier 1 runs via scripts/check_health.sh; baselines freeze legacy
# violations so CI is green Day 1 while new violations fail.
[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/core/src",
    "packages/data/src",
    "packages/accounting/src",
    "packages/strategies/src",
    "packages/proof/src",
    "packages/web/src",
    "src",
    "tests",
    "packages/core/tests",
    "packages/data/tests",
    "packages/accounting/tests",
    "packages/strategies/tests",
    "packages/proof/tests",
    "packages/web/tests",
]
extend-exclude = ["**/vendor/**", "**/__pycache__/**"]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "B",
    "BLE",
    "UP",
    "SIM",
    "C4",
    "PIE",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "RUF",
]
ignore = [
    "E501",
    # RUF001/RUF003 flag intentional Russian UI strings/comments (AGENTS.md).
    "RUF001",
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR0913", "PLR0915", "BLE001", "E701", "E702", "RUF059", "E731"]
"packages/*/tests/**/*.py" = ["PLR0913", "PLR0915", "BLE001", "E701", "E702", "RUF059", "E731"]
# Legacy ratchet (Step 1): frozen violations in existing files. New files
# have no ignores and must be clean. Burn down per Step 4 of the plan.
"packages/accounting/tests/test_position_sizing.py" = ["B905"]
"packages/accounting/tests/test_run_artifact_import.py" = ["C401", "SIM117"]
"packages/core/src/moex_spread_lab/core/_fastcore_loader.py" = ["BLE001"]
"packages/core/src/moex_spread_lab/core/settings.py" = ["PLR0912"]
"packages/core/src/moex_spread_lab/core/w0.py" = ["C901", "PLR0912"]
"packages/core/tests/test_architecture_dag.py" = ["PLR0912"]
"packages/core/tests/test_cli_plugins.py" = ["SIM117"]
"packages/data/tests/test_benchmark.py" = ["C408"]
"packages/data/tests/test_h1_migration.py" = ["RUF005", "SIM117"]
"packages/data/tests/test_h1_seal.py" = ["RUF005"]
"packages/data/tests/test_iss.py" = ["RUF012"]
"packages/data/tests/test_storage_policy.py" = ["SIM117"]
"packages/proof/src/moex_spread_lab/proof/carry_intent_accounting.py" = ["PLR0913"]
"packages/proof/src/moex_spread_lab/proof/pair_plugin_accounting.py" = ["PLR0913"]
"packages/proof/src/moex_spread_lab/proof/proof_kernel.py" = ["PLR0913"]
"packages/strategies/tests/contract/test_strategy_conformance.py" = ["B023"]
"packages/strategies/tests/test_carry.py" = ["B905", "C408"]
"packages/web/src/moex_spread_lab/web/routes_proof.py" = ["PLR0913"]
"packages/web/src/moex_spread_lab/web/server.py" = ["C901", "PLR0911", "SIM105"]
"packages/web/tests/browser/automatic_size_smoke.py" = ["E741"]
"packages/web/tests/browser/global_capital_smoke.py" = ["B905"]
"packages/web/tests/browser/period_settings_smoke.py" = ["E402"]
"packages/web/tests/browser/strategy_search_smoke.py" = ["E402"]
"tests/funding_fixtures.py" = ["B905"]
"tests/proof_fixtures.py" = ["B905"]

[tool.basedpyright]
pythonVersion = "3.12"
include = [
    "packages/core/src",
    "packages/data/src",
    "packages/accounting/src",
    "packages/strategies/src",
    "packages/proof/src",
    "packages/web/src",
    "src",
    "scripts",
]
exclude = ["**/vendor/**", "**/__pycache__/**"]
extraPaths = [
    ".typecheck_typings",
    "scripts",
    "scripts/typings",
    "packages/core/tests",
    "packages/accounting/tests",
    "packages/proof/tests",
    "tests",
    "packages/strategies/tests/contract",
    "packages/web/tests/browser",
]
baselineFile = ".basedpyright/baseline.json"
typeCheckingMode = "standard"
strict = [
    "packages/core/src",
    "packages/accounting/src",
    "packages/data/src",
    "packages/proof/src",
    "packages/strategies/src",
]
reportMissingTypeStubs = false
reportMissingImports = "error"

[tool.complexipy]
paths = ["packages", "src", "scripts"]
max-complexity-allowed = 15
quiet = false

[tool.vulture]
paths = ["packages", "src", "scripts"]
exclude = ["*/vendor/*"]
min_confidence = 80
sort_by_size = true

[tool.size-report]
output = "../moex-spread-lab.size-report.html"
locale = "en"
title = ""
heading = ""
fixCommand = "uv run size --write"
metrics = ["raw", "min", "tok"]
skip = [".basedpyright/baseline.json", ".clang-tidy", ".gitignore", ".python-version", ".size-report-issues.json", "config/launchd/local.moex-spread-lab.screener.plist.example", "docs/inputs/moy_online_praym.pdf", "docs/inputs/prof_privilegiya.pdf", "package-lock.json", "packages/core/tests/cli_help_hashes.json", "packages/data/src/moex_spread_lab/data/lake/io.py", "packages/proof/src/moex_spread_lab/proof/screener_search.py", "packages/proof/src/moex_spread_lab/proof/web_legacy.py", "packages/strategies/tests/test_pair_plugin_signal_day.py", "packages/strategies/tests/test_pair_screener_surface.py", "packages/proof/tests/test_screener_math.py", "packages/proof/tests/test_screener_search.py", "packages/web/src/moex_spread_lab/web/static_assets.py", "packages/web/src/moex_spread_lab/web/store.py", "packages/web/src/moex_spread_lab/web/strategy_registry.py", "packages/web/src/moex_spread_lab/web/vendor/LICENSE.lightweight-charts", "scripts/moex-spread-lab-screener", "src/moex_spread_lab/screener_search.py", "uv.lock", "src/moex_spread_lab.egg-info/PKG-INFO", "src/moex_spread_lab/vendor/LICENSE.lightweight-charts"]

[tool.size-report.minify]
engine = "strip"
ext = {}
guard = [".js", ".mjs", ".cjs"]

[tool.size-report.tokens]
family = "openai"
encoding = "o200k_base"

[tool.size-report.hooks]
enabled = true

[tool.size-report.links]
commitUrl = "https://github.com/vernikr/moex-spread-lab/commit/{sha}"

[tool.size-report.rows]
merges = true
sha = true

[tool.size-report.issues]
path = ".size-report-issues.json"
repo = "vernikr/moex-spread-lab"
project = 2

