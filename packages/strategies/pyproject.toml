[project]
name = "msl-strategies"
version = "0.9.0"
description = "MOEX Spread Lab Layer 2 strategies: isolated pluggable strategy families, discovery registry, and screener/calendar datasets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "msl-accounting",
    "msl-core",
    "msl-data",
]

[project.entry-points."moex_spread_lab.cli"]
strategies = "moex_spread_lab.strategies.cli:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
