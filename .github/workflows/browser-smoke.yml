name: Browser smoke (scheduled)

on:
  workflow_dispatch:
  schedule:
    - cron: "33 5 * * 3"  # weekly, Wednesday 05:33 UTC

# Playwright Chromium suites over synthetic data (packages/web/tests/browser/*_smoke.py).
# Kept out of per-push CI on purpose: they are slower than package unit tests.
# The architecture/manifest/secret gate runs before the browser installation.

permissions:
  contents: read

env:
  UV_COMPILE_BYTECODE: "1"
  UV_LINK_MODE: copy
  MOEX_OFFLINE_ONLY: "1"

jobs:
  browser-smoke:
    name: Playwright smoke suites (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Verify package DAG, plugin discovery, manifest, and tracked-file secrets
        run: uv run python scripts/architecture_gate.py

      - name: Install Chromium for Playwright
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Run every browser smoke suite
        run: uv run --with playwright python scripts/run_browser_smokes.py
