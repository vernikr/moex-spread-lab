[project]
name = "moex-spread-lab"
version = "0.9.0"
description = "Research-first MOEX futures-spread evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2024",
    "duckdb>=1.2,<2",
    "msl-accounting",
    "msl-core",
    "msl-data",
    "msl-strategies",
    "msl-proof",
    "openpyxl>=3.1,<4",
    "optuna>=4.2,<5",
    "pyarrow>=18,<20",
    "zstandard>=0.23,<1",
]

[project.scripts]
moex-spread-lab = "moex_spread_lab.cli:main"

[project.entry-points."moex_spread_lab.cli"]
web = "moex_spread_lab.cli_web:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
msl-accounting = { workspace = true }
msl-core = { workspace = true }
msl-data = { workspace = true }
msl-strategies = { workspace = true }
msl-proof = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
moex_spread_lab = ["*.html", "vendor/*.js", "vendor/LICENSE.*"]

[tool.pytest.ini_options]
pythonpath = [
    "packages/core/src",
    "packages/data/src",
    "packages/accounting/src",
    "packages/strategies/src",
    "packages/proof/src",
    "src",
    "packages/data/tests",
    "packages/accounting/tests",
    "packages/strategies/tests",
    "packages/proof/tests",
    "tests",
]
testpaths = [
    "packages/core/tests",
    "packages/data/tests",
    "packages/accounting/tests",
    "packages/strategies/tests",
    "packages/proof/tests",
    "tests",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-subtests>=0.14,<1",
    "pytest-xdist>=3.6,<4",
    "pytest-split>=0.9,<1",
]
