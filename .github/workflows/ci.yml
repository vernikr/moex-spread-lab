name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"  # weekly, Monday 04:17 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_COMPILE_BYTECODE: "1"
  UV_LINK_MODE: copy

jobs:
  scope:
    name: scope (diff router)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      packages: ${{ steps.scope.outputs.packages }}
      has_packages: ${{ steps.scope.outputs.has_packages }}
      run_tier2: ${{ steps.scope.outputs.run_tier2 }}
      perf_equivalence: ${{ steps.scope.outputs.perf_equivalence }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute change scope (docs-only, package legs, perf-equivalence, Tier 2)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/change_scope.py
          --event "$EVENT_NAME"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  architecture-gate:
    name: architecture-gate (<2s)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment (incl. dev group)
        run: uv sync --frozen

      - name: Verify package DAG, plugin discovery, manifest, and tracked-file secrets
        run: uv run python scripts/architecture_gate.py

  code-health:
    name: code-health (Tier 1 + conditional C99 Tier 2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment (incl. dev group)
        run: uv sync --frozen

      - name: Run Tier 1 deterministic code-health gate
        run: ./scripts/check_health.sh

      - name: Detect C99 Tier 2 trigger paths
        id: tier2
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          uv run python scripts/should_run_c_tier2.py
          --event "$EVENT_NAME"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Install clang-tidy and clang sanitizer runtime (Tier 2)
        if: steps.tier2.outputs.run_tier2 == 'true'
        run: |
          if ! command -v clang-tidy >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang clang-tidy
          fi

      - name: Run C99 clang-tidy static analysis (Tier 2)
        if: steps.tier2.outputs.run_tier2 == 'true'
        run: |
          uv run python scripts/gen_compile_commands.py
          clang-tidy -p . packages/core/src/moex_spread_lab/core/_fastcore.c

      - name: Run ASan + UBSan equivalence & parity gate (Tier 2)
        if: steps.tier2.outputs.run_tier2 == 'true'
        run: >-
          uv run python scripts/run_sanitized_pytest.py -v --tb=short
          packages/proof/tests/test_perf_equivalence.py
          packages/proof/tests/test_fastcore_parity.py

  package-tests:
    name: pytest ${{ matrix.package }} (ubuntu-latest)
    needs: [scope, architecture-gate]
    if: needs.scope.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.scope.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment (incl. dev group)
        run: uv sync --frozen

      - name: Precompile and verify C99 fastcore
        run: >-
          uv run python -c "from moex_spread_lab.core._fastcore_loader import load_fastcore;
          import sys; sys.exit(0 if load_fastcore() is not None else 1)"

      - name: Run package tests with dynamic xdist loadfile scheduling
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q -n auto --dist loadfile "packages/${{ matrix.package }}/tests" --durations=15 \
            | tee "durations-${{ matrix.package }}.log"

      - name: Upload package duration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-${{ matrix.package }}
          path: durations-${{ matrix.package }}.log
          retention-days: 7

  perf-equivalence:
    name: perf equivalence (ubuntu-latest)
    needs: [scope, architecture-gate]
    if: needs.scope.outputs.perf_equivalence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment (incl. dev group)
        run: uv sync --frozen

      - name: Precompile and verify C99 fastcore
        run: >-
          uv run python -c "from moex_spread_lab.core._fastcore_loader import load_fastcore;
          import sys; sys.exit(0 if load_fastcore() is not None else 1)"

      - name: Run bit-for-bit equivalence tests
        shell: bash
        run: >-
          set -o pipefail;
          uv run pytest -q -n auto --dist loadfile
          packages/proof/tests/test_perf_equivalence.py
          --durations=15 | tee durations-perf.log

      - name: Upload duration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-perf-equivalence
          path: durations-perf.log
          retention-days: 7

  ci-ok:
    name: ci-ok
    if: always()
    needs: [scope, architecture-gate, code-health, package-tests, perf-equivalence]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every needed job to pass or be skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {
              name: data.get("result")
              for name, data in sorted(needs.items())
              if data.get("result") not in ("success", "skipped")
          }
          for name, data in sorted(needs.items()):
              print(f"needs.{name}: {data.get('result')}")
          if bad:
              print(f"ci-ok: FAILED jobs: {', '.join(bad)}", file=sys.stderr)
              sys.exit(1)
          print("ci-ok: all needed jobs passed or were skipped")
          EOF
