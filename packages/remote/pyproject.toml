[project]
name = "msl-remote"
version = "0.9.0"
description = "Authenticated workstation bridge and isolated benchmark tooling"
requires-python = ">=3.12,<3.13"
dependencies = ["msl-core"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
