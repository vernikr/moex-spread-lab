[project]
name = "moex-spread-lab"
version = "0.9.0"
description = "Research-first MOEX futures-spread evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2024",
    "duckdb>=1.2,<2",
    "openpyxl>=3.1,<4",
    "optuna>=4.2,<5",
    "pyarrow>=18,<20",
    "zstandard>=0.23,<1",
]

[project.scripts]
moex-spread-lab = "moex_spread_lab.cli:main"

[tool.uv]
package = true

[tool.setuptools.package-data]
moex_spread_lab = ["*.html", "vendor/*.js", "vendor/LICENSE.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
